<!doctype html>
<!--
  Markdown → HTML 转化骨架（blog-content-publisher 技能专用）

  设计基线（2026-07 升级「深海 + 紫极光」）：
    - 颜色变量与 tailwind.config.js 的 brand-* token byte-for-byte 对齐
    - 字体与 src/index.css 顶部 @import 同款（Fraunces / IBM Plex Sans / JetBrains Mono）
    - 所有 :hover 加 [@media(hover:hover)] 守卫，防 iOS Safari 触屏残留
    - prefers-reduced-motion 复位所有 transform / box-shadow / transition

  iframe 视口不继承主站 Tailwind 编译产物，必须自补这些样式。
  CLAUDE.md 规则 6 + .trellis/spec/frontend/component-and-style-guidelines.md §品牌色
  §字体 §触屏 hover 守卫三节是单一来源；修改此处必须同步检查那三节。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title><!-- title --></title>

  <!-- 字体：与 src/index.css 同款（含 ital/opsz/wght 轴） -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

    /* 品牌色变量（与 tailwind.config.js 的 brand.* 对齐）：
         --bg          brand.dark     #0a0e1f  紫蓝近黑
         --surface     brand.surface  #14193a  卡片 / 按钮底色
         --surface-2   brand.surface-2 #1e2348  hover 次级表面
         --border      brand.border   #2a3158  边框
         --primary     brand.primary  #5b8def  电光蓝（主强调 / focus ring）
         --accent      brand.accent   #a78bfa  极光紫（副强调 / chip）
         --glow        brand.glow     #4cc9f0  电光青蓝（hover 发光）
         --fg          brand.light    #f8fafc  主文字
         --mid         brand.mid      #94a3b8  次级文字（excerpt / meta）
         --dim         brand.dim      #64748b  三级文字 / 占位
       注释保留旧变量名（accent / accent-alt / accent-grn）以维持模板结构性可读性，
       色值已对齐新 token。修改品牌色板时同步更新 tailwind.config.js + 此处。 */
    :root {
      --bg:         #0a0e1f;
      --surface:    #14193a;
      --surface-2:  #1e2348;
      --border:     #2a3158;
      --accent:     #a78bfa; /* 极光紫，brand.accent */
      --accent-alt: #5b8def; /* 电光蓝，brand.primary */
      --accent-grn: #4cc9f0; /* 电光青蓝，brand.glow */
      --fg:         #f8fafc;
      --mid:        #94a3b8;
      --dim:        #64748b;
    }
    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--fg);
      /* 正文使用 IBM Plex Sans（与主站一致），fallback 走 system-ui */
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.75;
      /* 响应式可读宽：桌面 ~720px，移动端自然收缩 */
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px 64px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* 标题使用 Fraunces 展示衬线（主站同款），fallback Georgia → serif */
    h1, h2, h3, h4 {
      font-family: 'Fraunces', Georgia, serif;
      color: var(--fg);
      line-height: 1.3;
      letter-spacing: 0.01em;
      margin-top: 1.6em;
      margin-bottom: 0.6em;
      /* 标题斜体可显式用 font-style: italic；Fraunces opsz 大光学尺寸戏剧化 */
      font-feature-settings: "opsz" 144;
    }
    h1 { font-size: 2rem; font-weight: 600; }
    h2 { font-size: 1.5rem; font-weight: 600; }
    h3 { font-size: 1.2rem; font-weight: 600; }

    p  { margin: 0 0 1em; }
    em { font-style: italic; color: var(--mid); }
    strong { color: var(--fg); }

    /* 链接使用极光紫；外链由技能统一加 target="_blank" rel="noreferrer" */
    a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    /* 触屏守卫：iOS Safari / 触屏设备的 :hover 会"sticky"，
       残留到下次 tap。仅在 hover 能力设备启用色彩变化。 */
    @media (hover: hover) {
      a:hover { color: var(--fg); }
    }

    /* 列表 */
    ul, ol { padding-left: 1.4em; margin: 0 0 1em; }
    li { margin-bottom: 0.35em; }

    /* 引用块 */
    blockquote {
      margin: 1.2em 0;
      padding: 0.6em 1em;
      border-left: 3px solid var(--accent);
      background: var(--surface);
      color: var(--mid);
      border-radius: 0 6px 6px 0;
      font-style: italic;
    }
    blockquote p:last-child { margin-bottom: 0; }

    /* 代码：JetBrains Mono（主站同款） */
    code {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.9em;
      background: var(--surface);
      color: var(--accent);
      padding: 0.15em 0.4em;
      border-radius: 4px;
    }
    pre {
      background: var(--surface);
      padding: 16px 18px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 1em 0 1.4em;
      line-height: 1.55;
    }
    pre code {
      background: transparent;
      color: var(--fg);
      padding: 0;
      border-radius: 0;
    }

    /* 表格：保留原表格结构 */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0 1.4em;
      font-size: 0.95em;
    }
    thead th {
      text-align: left;
      color: var(--accent);
      border-bottom: 2px solid var(--mid);
      padding: 0.5em 0.7em;
    }
    tbody td {
      border-bottom: 1px solid rgba(148,163,184,0.25);
      padding: 0.5em 0.7em;
    }
    /* 表格行 hover 同样走触屏守卫 */
    @media (hover: hover) {
      tbody tr:hover { background: var(--surface-2); }
    }

    /* 分割线 */
    hr {
      border: none;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--mid), transparent);
      margin: 2em 0;
      opacity: 0.5;
    }

    /* 图片自适应 */
    img { max-width: 100%; height: auto; border-radius: 6px; }

    /* 移动端：padding 收紧，主体仍保持可读 */
    @media (max-width: 600px) {
      body { padding: 32px 16px 48px; font-size: 15px; }
      h1 { font-size: 1.6rem; }
      pre { padding: 12px 14px; }
    }

    /* prefers-reduced-motion 复位：禁用所有过渡 / 变换 / 发光效果，
       与主站 src/index.css + component-and-style-guidelines.md §交互与可访问性 保持一致 */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
        transform: none !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body>
  <h1><!-- title --></h1>
  <!-- 正文 -->
</body>
</html>
