<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    /* 品牌色与字体兜底：iframe 不继承主站 Tailwind，必须自补这些样式。 */
    :root {
      --bg:         #141413;   /* brand.dark */
      --surface:    #1c1b1a;   /* brand.surface */
      --fg:         #faf9f5;   /* brand.light */
      --mid:        #b0aea5;   /* brand.mid */
      --accent:     #d97757;   /* brand.orange */
      --accent-alt: #6a9bcc;   /* brand.blue */
      --accent-grn: #788c5d;   /* brand.green */
    }
    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Lora', Georgia, 'Songti SC', 'STSong', serif;
      font-size: 16px;
      line-height: 1.75;
      /* 响应式可读宽：桌面 ~720px，移动端自然收缩。 */
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px 64px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    h1, h2, h3, h4 {
      font-family: 'Poppins', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: var(--fg);
      line-height: 1.3;
      letter-spacing: 0.01em;
      margin-top: 1.6em;
      margin-bottom: 0.6em;
    }
    h1 { font-size: 2rem; font-weight: 600; }
    h2 { font-size: 1.5rem; font-weight: 600; }
    h3 { font-size: 1.2rem; font-weight: 600; }

    p  { margin: 0 0 1em; }
    em { font-style: italic; color: var(--mid); }
    strong { color: var(--fg); }

    /* 链接使用品牌橙；外链由技能统一加 target="_blank" rel="noreferrer"。 */
    a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    a:hover { color: var(--fg); }

    /* 列表 */
    ul, ol { padding-left: 1.4em; margin: 0 0 1em; }
    li { margin-bottom: 0.35em; }

    /* 引用块 */
    blockquote {
      margin: 1.2em 0;
      padding: 0.6em 1em;
      border-left: 3px solid var(--accent);
      background: var(--surface);
      color: var(--mid);
      border-radius: 0 6px 6px 0;
      font-style: italic;
    }
    blockquote p:last-child { margin-bottom: 0; }

    /* 代码 */
    code {
      font-family: 'JetBrains Mono', Menlo, Consolas, monospace;
      font-size: 0.9em;
      background: var(--surface);
      color: var(--accent);
      padding: 0.15em 0.4em;
      border-radius: 4px;
    }
    pre {
      background: var(--surface);
      padding: 16px 18px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 1em 0 1.4em;
      line-height: 1.55;
    }
    pre code {
      background: transparent;
      color: var(--fg);
      padding: 0;
      border-radius: 0;
    }

    /* 表格：读 `source-formats.md` 后技能要保留原表格结构。 */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0 1.4em;
      font-size: 0.95em;
    }
    thead th {
      text-align: left;
      color: var(--accent);
      border-bottom: 2px solid var(--mid);
      padding: 0.5em 0.7em;
    }
    tbody td {
      border-bottom: 1px solid rgba(176,174,165,0.25);
      padding: 0.5em 0.7em;
    }
    tbody tr:hover { background: var(--surface); }

    /* 分割线 */
    hr {
      border: none;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--mid), transparent);
      margin: 2em 0;
      opacity: 0.5;
    }

    /* 图片自适应 */
    img { max-width: 100%; height: auto; border-radius: 6px; }

    /* 移动端：padding 收紧，主体仍保持可读。 */
    @media (max-width: 600px) {
      body { padding: 32px 16px 48px; font-size: 15px; }
      h1 { font-size: 1.6rem; }
      pre { padding: 12px 14px; }
    }
  </style>
</head>
<body>
  <h1><!-- title --></h1>
  <!-- 正文 -->
</body>
</html>
